name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          
      - run: npm ci

      - name: Check author IDs match
        run: python tests/check_ids.py

      - name: Compare metrics with networkx
        run: python tests/compare_metrics.py

      - name: Test the obfuscation pipeline
        run: python tests/obfuscation_pipeline.py
        
      - name: Check site files are committed
        run: python tests/check_site_files.py
